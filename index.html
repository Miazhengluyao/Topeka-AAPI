<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topeka AANHPI 打卡地图</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --delco-blue: #2CA6D3;
            --delco-green: #2D6A4F;
            --delco-red: #E63946;
            --delco-yellow: #FFB703;
        }
        body { font-family: 'STHeiti', 'Microsoft YaHei', sans-serif; }
        #map { height: 280px; width: 100%; border-radius: 1.5rem; z-index: 1; border: 4px solid white; }
        .hidden-view { display: none !important; }
        .map-card { position: relative; overflow: hidden; transition: all 0.3s ease; }
        .map-card::after { content: "START MAP ➔"; position: absolute; bottom: 10px; right: 20px; font-size: 10px; font-weight: bold; opacity: 0.6; }
        /* 模拟生成海报的样式 */
        #poster-canvas { background: linear-gradient(135deg, #2CA6D3, #2D6A4F); color: white; padding: 40px; border-radius: 20px; display: none; }
    </style>
</head>
<body class="bg-[#F8FBFC] text-slate-800 pb-20">

    <header class="bg-[#2CA6D3] text-white p-6 text-center shadow-lg sticky top-0 z-50">
        <button id="back-btn" onclick="goHome()" class="hidden-view absolute left-4 top-7 bg-white/20 px-3 py-1 rounded-full text-xs font-bold transition">← 返回</button>
        <h1 class="text-2xl font-black tracking-tight leading-none">TOPEKA AANHPI</h1>

                <div class="mt-4 inline-block bg-blue-50 px-6 py-3 rounded-2xl border-2 border-blue-100">

                </div>
            </section>

            <section class="space-y-4">

                <div class="grid grid-cols-3 gap-3 text-center">
                    <div>
                        <img src="https://di2ponv0v5otw.cloudfront.net/posts/2026/05/15/69ffce26bedd34cb54882d6f/m_69ffce2d6e352f758f8447fc.jpg" class="w-full aspect-square object-cover rounded-xl border border-slate-100 mb-2">

                    <div>

                        <p class="text-[10px] font-black leading-tight text-amber-700">Silver (15+)<br>Woven Bamboo</p>
                    </div>
                    <div>
                        <img src="https://di2ponv0v5otw.cloudfront.net/posts/2026/05/15/69f125e4dbd8f0487db7e8f5/m_69f125ec6e352f559286438f.jpg" class="w-full aspect-square object-cover rounded-xl border border-slate-100 mb-2">
                        <p class="text-[10px] font-black leading-tight text-blue-700">Gold (30+)<br>Elephant Scent</p>
                    </div>
                </div>
            </section>

            <div class="pt-4">
                <button onclick="generatePoster()" class="w-full bg-[#2D6A4F] text-white py-4 rounded-2xl font-black shadow-lg shadow-emerald-100 flex items-center justify-center gap-2">
                    ✨ 生成成就海报 / Generate Poster
                </button>
            </div>
        </div>

        <div id="map-view" class="hidden-view space-y-4">
            <div id="map"></div>
            <h2 id="category-title" class="text-xl font-black text-[#2D6A4F] uppercase border-l-4 border-[#FFB703] pl-3 ml-2">地图详情</h2>
            <div id="spots-list" class="space-y-4 pb-12"></div>
        </div>

        <div id="poster-modal" class="fixed inset-0 bg-black/80 z-[100] hidden-view flex flex-col items-center justify-center p-6 text-center">
            <div id="poster-area" class="bg-white p-8 rounded-3xl max-w-sm w-full space-y-4">
                <h2 class="text-[#2CA6D3] font-black text-2xl uppercase italic">Topeka AANHPI</h2>
                <div class="text-4xl">🏆</div>
                <p class="text-slate-800 font-bold">我已在托皮卡成功打卡</p>
                <p id="poster-count" class="text-6xl font-black text-[#E63946]">0</p>
                <p class="text-xs text-slate-400">Join the challenge and win Mahjong!</p>
                <div class="flex justify-center gap-4 pt-4 border-t">
                    <button onclick="share('fb')" class="text-blue-600 font-bold">FB</button>
                    <button onclick="share('ig')" class="text-pink-600 font-bold">IG</button>
                    <button onclick="share('sc')" class="text-yellow-500 font-bold">Snap</button>
                </div>
            </div>
            <button onclick="closePoster()" class="mt-8 text-white font-bold underline">关闭 / Close</button>
        </div>

    </main>
